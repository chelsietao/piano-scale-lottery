<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Scale Practice Lottery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1714;
    --paper: #f5f0e8;
    --gold: #b8860b;
    --rust: #8b3a2a;
    --muted: #7a7060;
    --border: rgba(26,23,20,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 38px, rgba(180,160,120,0.18) 38px, rgba(180,160,120,0.18) 39px);
    pointer-events: none; z-index: 0;
  }
  .container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header { text-align: center; margin-bottom: 2.5rem; }
  .treble-clef { font-size: 64px; line-height: 1; display: block; margin-bottom: 0.25rem; filter: opacity(0.85); }
  header h1 { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); line-height: 1.2; margin-bottom: 6px; }
  header .subtitle { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 300; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .draw-section { margin-bottom: 2rem; }
  .draw-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; text-align: center; }
  .btn-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .draw-btn { position: relative; background: var(--ink); color: var(--paper); border: none; border-radius: 3px; padding: 14px 8px; font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.15s; overflow: hidden; }
  .draw-btn::after { content: ''; position: absolute; inset: 0; background: var(--gold); opacity: 0; transition: opacity 0.2s; }
  .draw-btn:hover { transform: translateY(-2px); }
  .draw-btn:hover::after { opacity: 1; }
  .draw-btn:active { transform: scale(0.97); }
  .draw-btn span { position: relative; z-index: 1; display: block; }
  .draw-btn .btn-count { font-size: 22px; line-height: 1; }
  .draw-btn .btn-label { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 300; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; opacity: 0.7; }
  #results { margin-bottom: 2rem; }
  .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
  .empty-state .empty-icon { font-size: 40px; display: block; margin-bottom: 8px; opacity: 0.4; }
  .empty-state p { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.05em; }
  .result-card { background: white; border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 4px; padding: 1.25rem 1.25rem 1rem; margin-bottom: 12px; animation: slideIn 0.3s ease forwards; opacity: 0; position: relative; overflow: hidden; }
  .result-card::before { content: ''; position: absolute; top: 0; right: 0; width: 80px; height: 80px; background: radial-gradient(circle at top right, rgba(184,134,11,0.06), transparent 70%); pointer-events: none; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card-set-num { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .card-key { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--ink); line-height: 1; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .black-badge { font-family: 'DM Mono', monospace; font-size: 9px; background: var(--ink); color: var(--paper); padding: 2px 6px; border-radius: 2px; font-weight: 400; letter-spacing: 0.08em; }
  .card-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 7px; }
  .card-field { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); min-width: 52px; flex-shrink: 0; margin-top: 2px; }
  .card-val { font-size: 14px; color: var(--ink); line-height: 1.4; }
  .touch-name { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 5px; }
  .touch-desc { font-size: 12px; color: var(--muted); line-height: 1.55; }
  .touch-trains { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--gold); margin-top: 4px; letter-spacing: 0.03em; }
  .card-divider { height: 1px; background: var(--border); margin: 12px 0 10px; }
  .card-pattern { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .card-pattern .arrow { color: var(--gold); }
  .history-section { border-top: 1px solid var(--border); padding-top: 1.5rem; }
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .history-title { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .clear-btn { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 3px; padding: 4px 10px; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
  .clear-btn:hover { color: var(--rust); border-color: var(--rust); }
  .hist-empty { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); text-align: center; padding: 1.25rem 0; opacity: 0.6; }
  .hist-item { border-top: 1px solid var(--border); padding: 10px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: start; }
  .hist-key { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: var(--ink); }
  .hist-time { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-align: right; margin-top: 3px; }
  .hist-detail { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); grid-column: 1 / -1; margin-top: 2px; line-height: 1.4; }
  footer { text-align: center; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
  footer p { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--muted); opacity: 0.6; }
  @media (max-width: 360px) { header h1 { font-size: 22px; } .card-key { font-size: 24px; } .draw-btn .btn-count { font-size: 18px; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="treble-clef">𝄞</span>
    <h1>Scale Practice<br>Lottery</h1>
    <p class="subtitle">24 Keys · Smart Draw · No Repeats</p>
  </header>

  <div class="draw-section">
    <p class="draw-label">Draw a practice set</p>
    <div class="btn-grid">
      <button class="draw-btn" onclick="draw(1)">
        <span class="btn-count">1</span>
        <span class="btn-label">set</span>
      </button>
      <button class="draw-btn" onclick="draw(3)">
        <span class="btn-count">3</span>
        <span class="btn-label">sets</span>
      </button>
      <button class="draw-btn" onclick="draw(5)">
        <span class="btn-count">5</span>
        <span class="btn-label">sets</span>
      </button>
    </div>
  </div>

  <div id="results">
    <div class="empty-state">
      <span class="empty-icon">𝄫</span>
      <p>Tap a button to draw your practice set</p>
    </div>
  </div>

  <div class="history-section">
    <div class="history-header">
      <span class="history-title">Today's history</span>
      <button class="clear-btn" onclick="clearHistory()">Clear</button>
    </div>
    <div id="history">
      <div class="hist-empty">— no draws yet —</div>
    </div>
  </div>

  <footer>
    <p>Ascending → Contrary motion → Descending · 4/4 time</p>
    <p style="margin-top:6px">60 · 70 · 80 · 90 · 100 BPM · Black keys 2× weight</p>
  </footer>
</div>

<script>
// ── Databases ──────────────────────────────────────────────────────────────

const WHITE_KEYS = [
  "C major","G major","D major","A major","E major","B major","F major",
  "A minor","E minor","B minor","C minor","G minor","D minor","F minor"
];

const BLACK_KEYS = [
  "F-sharp major","D-flat major","A-flat major","E-flat major","B-flat major",
  "F-sharp minor","C-sharp minor","G-sharp minor","E-flat minor","B-flat minor"
];

const TOUCHES = [
  {
    name: "Touch Before Sound",
    desc: "Place the fingertip on the key before producing the sound. Weight path: arm weight → relaxed wrist → supported fingertip → key bottom.",
    trains: "Avoiding striking from the air."
  },
  {
    name: "Silent Key Contact",
    desc: "Touch each key silently first, pause briefly, then play. This prevents flying fingers and rough attacks.",
    trains: "Preparation before sound."
  },
  {
    name: "Slow Key Descent",
    desc: "Depress each key very slowly until it reaches the bottom. Do not press forcefully; let the weight sink naturally.",
    trains: "Sensing key resistance."
  },
  {
    name: "Fast Descent Without Striking",
    desc: "Enter the key quickly with the fingertip, but do not hit from above. The speed is in the fingertip, not in an arm impact.",
    trains: "A bright sound without sharpness."
  },
  {
    name: "Shallow Key Descent",
    desc: "Use very little weight, as if touching the surface of water. Useful for Debussy, quick soft passages, and chromatic scales.",
    trains: "Light sound with control."
  },
  {
    name: "Deep Key Descent",
    desc: "Play each note fully to the key bottom while keeping the wrist free. Useful for Beethoven, slow scales, and full tone production.",
    trains: "Core sound."
  },
  {
    name: "Stay at the Key Bottom",
    desc: "After playing each note, keep the fingertip at the bottom briefly. This helps prevent an empty or floating sound.",
    trains: "Not pulling the weight away too quickly."
  },
  {
    name: "Release Tension at the Key Bottom",
    desc: "Keep the key depressed, but release unnecessary arm tension immediately after sound. Important for long notes, legato, and slow movements.",
    trains: "Holding a key without stiffness."
  },
  {
    name: "Finger-to-Finger Transfer",
    desc: "After playing C, feel the weight gradually transfer to the finger playing D. Do not release C first and then search for D; let C pass the weight into D.",
    trains: "Connection between notes."
  },
  {
    name: "Arm Follows the Scale Direction",
    desc: "When ascending, let the arm move slightly to the right; when descending, slightly to the left. Do not let the wrist get stuck in one place.",
    trains: "Matching body direction with musical direction."
  },
  {
    name: "Weight Wave",
    desc: "Shape every four notes as a small wave: slightly deeper on the first note, released by the fourth. The scale becomes a breathing line, not a row of mechanical notes.",
    trains: "Phrasing inside scales."
  },
  {
    name: "Two-Note Weight Transfer",
    desc: "Group notes in pairs: C-D, E-F, G-A. Let the first note receive weight and the second note release it.",
    trains: "Small-unit weight flow."
  },
  {
    name: "Four-Note Weight Transfer",
    desc: "Group the scale as C-D-E-F, G-A-B-C. Useful when scales sound note-by-note without a phrase.",
    trains: "Directional thinking in note groups."
  },
  {
    name: "Prepare the Thumb Before It Plays",
    desc: "Before the thumb plays, the wrist has already opened a small space for it. Do not wait until the thumb gets stuck and then force it under.",
    trains: "Transferring weight before thumb passage."
  },
  {
    name: "Release After the Thumb",
    desc: "After the thumb plays, do not stay heavy on it. Transfer weight immediately to the next finger. Uneven scales often come from a heavy thumb.",
    trains: "Avoiding thumb accents."
  },
  {
    name: "Seamless Thumb Passage",
    desc: "At 3-1 or 4-1 crossings, do not allow the sound to become heavier or shorter.",
    trains: "Changing hand position without exposing it in the sound."
  },
  {
    name: "Horizontal Wrist Motion",
    desc: "Move the wrist only horizontally from side to side, without vertical bouncing. Useful for legato scales.",
    trains: "Scale direction and smooth connection."
  },
  {
    name: "Tiny Wrist Rebound",
    desc: "After each note, allow a very small wrist rebound. Useful for staccato scales.",
    trains: "Short sound without hardness."
  },
  {
    name: "Still-Wrist Test",
    desc: "Play with the wrist almost still, using mainly the fingers. After adding wrist freedom again, the sound should feel lighter.",
    trains: "Awareness of finger overwork."
  },
  {
    name: "Wrist Leads the Fingers",
    desc: "Think that the wrist carries the fingers across the keyboard, rather than each finger pressing separately.",
    trains: "Whole-hand flow instead of isolated finger striking."
  },
  {
    name: "Forearm Rotation",
    desc: "During patterns such as 1-2-3-1, feel a tiny rotation in the forearm. Especially useful for chromatic scales and fast passagework.",
    trains: "Preventing the fingers from carrying all the effort alone."
  },
  {
    name: "Rotate and Return",
    desc: "After a small forearm rotation, return to a neutral position.",
    trains: "Rotation as flexible adjustment, not a fixed tilted hand position."
  },
  {
    name: "Floating Wrist",
    desc: "Let the wrist feel lightly suspended, not collapsed or heavy.",
    trains: "Allowing weight into the key without sinking the joints."
  },
  {
    name: "Low-Wrist Key Contact",
    desc: "Keep the wrist slightly lower and the fingers close to the keys. Useful for slow legato.",
    trains: "Quiet, connected, close-to-the-key touch."
  },
  {
    name: "High-Wrist Light Touch",
    desc: "Keep the wrist slightly higher and the fingers lighter. Useful for chromatic scales and Debussy-like textures.",
    trains: "Transparency, speed, and clean articulation."
  },
  {
    name: "Stable Fingertip",
    desc: "When each note sounds, let the fingertip feel as if it is standing on the floor. Avoid collapsed fingers or weak sliding contact.",
    trains: "Fingertip support."
  },
  {
    name: "Supported Knuckles",
    desc: "Keep the main knuckles lifted and supported while playing the scale. If the knuckles collapse, the sound loses its core.",
    trains: "Stable hand structure."
  },
  {
    name: "Fingertip Grip",
    desc: "Let the fingertip lightly grip the key surface without squeezing. Useful for Beethoven and Chopin melodic lines.",
    trains: "Sound density."
  },
  {
    name: "Fingertip Gliding",
    desc: "Let the fingertip pass very lightly over the key surface. Useful for Debussy, Ravel, and chromatic scales.",
    trains: "Transparency, speed, and lightness."
  },
  {
    name: "Flatter-Finger Tone",
    desc: "Play a slow scale with a slightly flatter finger shape. Do not let the hand collapse.",
    trains: "Warmer and broader tone."
  },
  {
    name: "Curved-Finger Tone",
    desc: "Play with a more curved fingertip. Useful for Bach and fast passagework.",
    trains: "Brighter, clearer, more focused tone."
  },
  {
    name: "Two Fingertip Colors on the Same Scale",
    desc: "Play the same scale once with a rounded fingertip and once with a flatter fingertip.",
    trains: "Understanding that the same scale can have different tone colors."
  },
  {
    name: "Very Slow Legato Without Pedal",
    desc: "Connect every note genuinely to the next. Do not use pedal to hide gaps.",
    trains: "Real finger and weight connection."
  },
  {
    name: "Delayed Key Release",
    desc: "Release the previous note only after the next note has sounded. Keep the overlap short and controlled, not blurry.",
    trains: "Overlapping legato."
  },
  {
    name: "Seamless Thumb-Under Legato",
    desc: "Play especially slowly at 3-1 and 4-1 crossings.",
    trains: "Maintaining sound continuity through thumb passage."
  },
  {
    name: "One-Breath Scale",
    desc: "Think of the whole octave as one breath, not as eight separate notes. The body should know the destination from the first note.",
    trains: "Long-line phrasing."
  },
  {
    name: "Light Phrase Ending",
    desc: "Reduce weight gradually over the last two notes of the scale. Very useful for Beethoven phrasing.",
    trains: "Avoiding rushed or hard endings."
  },
  {
    name: "Touch First, Then Bounce",
    desc: "Touch the key first, then leave it with a small wrist rebound. This is the 'press first, then jump' feeling.",
    trains: "Short sound without dryness or striking."
  },
  {
    name: "Rebound from the Key Bottom",
    desc: "Let the hand rebound from the key after the sound reaches the bottom. The sound becomes short but round.",
    trains: "Avoiding active pulling away."
  },
  {
    name: "Fingertip Staccato",
    desc: "Keep the wrist almost still and use quick fingertip release. Useful for fast staccato passages.",
    trains: "Light and clear small articulation."
  },
  {
    name: "Wrist Staccato",
    desc: "Keep the fingers stable and use a small wrist bounce.",
    trains: "Elastic and rounded short notes."
  },
  {
    name: "Forearm Staccato",
    desc: "Use a little forearm weight moving in and out of the key. Useful for Beethoven and chordal staccato.",
    trains: "Louder staccato without hardness."
  },
  {
    name: "Short Sound, Continuous Breath",
    desc: "Even though the sound is short, let the hand direction continue toward the next note. This makes staccato musical rather than dry.",
    trains: "Separation in sound but continuity in the body."
  },
  {
    name: "pp Without Floating",
    desc: "Play the scale extremely softly, but make sure each key still reaches the bottom. Do not let the sound become weak or unfocused.",
    trains: "Soft sound with core."
  },
  {
    name: "ff Without Striking",
    desc: "Play loudly without breaking the sound. The knuckles stay supported and the wrist remains free.",
    trains: "Volume through weight transmission, not impact."
  },
  {
    name: "Crescendo Scale",
    desc: "Play an ascending scale from pp to ff. Do not suddenly force individual notes; let the arm weight deepen progressively.",
    trains: "Gradually increasing weight."
  },
  {
    name: "Diminuendo Scale",
    desc: "Play an ascending scale from ff to pp. Many players become weak when getting softer; this prevents that.",
    trains: "Gradually releasing weight while keeping fingertip control."
  },
  {
    name: "Bright-Tone Scale",
    desc: "Use faster fingertip entry with less arm weight. Useful for sparkling passages.",
    trains: "Bright, clear, focused sound."
  },
  {
    name: "Dark-Tone Scale",
    desc: "Stay close to the keys, enter more slowly, and use deeper weight. Useful for slow movements, Chopin middle sections, and Beethoven inner voices.",
    trains: "Warmth, depth, and inner tone."
  },
  {
    name: "Three Weight Levels on the Same Scale",
    desc: "Play the same scale three times: light weight, medium weight, and deep weight. This teaches that sound is not only loud or soft; it also has depth.",
    trains: "Building a scale of physical weight control."
  }
];

const TEMPOS = [60, 70, 80, 90, 100];

// ── Storage ────────────────────────────────────────────────────────────────

const STORE_KEY = 'piano_lottery_v5';

function freshStore() {
  return {
    date: new Date().toDateString(),
    whiteKeyPool: [...WHITE_KEYS],
    last5: [],
    history: []
  };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return freshStore();
    const s = JSON.parse(raw);
    if (s.date !== new Date().toDateString()) return freshStore();
    return s;
  } catch(e) { return freshStore(); }
}

function saveStore(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e) {}
}

// ── Helpers ────────────────────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ── Key selection ──────────────────────────────────────────────────────────

function pickKeys(store, n) {
  const last5Keys = store.last5.map(x => x.key);
  const batchKeys = [];

  for (let i = 0; i < n; i++) {
    const exclude = new Set([...last5Keys, ...batchKeys]);

    let availWhite = store.whiteKeyPool.filter(k => !exclude.has(k));
    let availBlack = BLACK_KEYS.filter(k => !exclude.has(k));

    if (availWhite.length === 0) availWhite = WHITE_KEYS.filter(k => !batchKeys.includes(k));
    if (availBlack.length === 0) availBlack = BLACK_KEYS.filter(k => !batchKeys.includes(k));

    const pool = [
      ...availWhite.map(k => ({ key: k, isBlack: false })),
      ...availBlack.map(k => ({ key: k, isBlack: true })),
      ...availBlack.map(k => ({ key: k, isBlack: true })),
    ];

    if (pool.length === 0) {
      store.whiteKeyPool = [...WHITE_KEYS];
      availWhite = WHITE_KEYS.filter(k => !batchKeys.includes(k));
      pool.push(...availWhite.map(k => ({ key: k, isBlack: false })));
      pool.push(...BLACK_KEYS.map(k => ({ key: k, isBlack: true })));
      pool.push(...BLACK_KEYS.map(k => ({ key: k, isBlack: true })));
    }

    const chosen = randFrom(pool);
    batchKeys.push(chosen.key);

    if (!chosen.isBlack) {
      store.whiteKeyPool = store.whiteKeyPool.filter(k => k !== chosen.key);
      if (store.whiteKeyPool.length === 0) store.whiteKeyPool = [...WHITE_KEYS];
    }
  }

  return batchKeys.map(k => ({ key: k, isBlack: BLACK_KEYS.includes(k) }));
}

// ── Touch selection ────────────────────────────────────────────────────────

function pickTouches(store, n) {
  const last5Names = store.last5.map(x => x.touchName);
  const batch = [];

  for (let i = 0; i < n; i++) {
    const exclude = new Set([...last5Names, ...batch]);
    let available = TOUCHES.filter(t => !exclude.has(t.name));
    if (available.length === 0) available = TOUCHES.filter(t => !batch.includes(t.name));
    if (available.length === 0) available = [...TOUCHES];
    const chosen = randFrom(available);
    batch.push(chosen.name);
  }
  return batch.map(name => TOUCHES.find(t => t.name === name));
}

// ── Tempo selection ────────────────────────────────────────────────────────

function pickTempos(store, n) {
  const last5Tempos = store.last5.map(x => x.tempo);

  if (n >= 5) return shuffle(TEMPOS);

  if (n === 1) {
    const available = TEMPOS.filter(t => !last5Tempos.includes(t));
    return [randFrom(available.length ? available : TEMPOS)];
  }

  const preferred = shuffle(TEMPOS.filter(t => !last5Tempos.includes(t)));
  const fallback  = shuffle(TEMPOS.filter(t => last5Tempos.includes(t)));
  return [...preferred, ...fallback].slice(0, n);
}

// ── Main draw ──────────────────────────────────────────────────────────────

function draw(n) {
  const store = loadStore();

  const keyObjs = pickKeys(store, n);
  const touches = pickTouches(store, n);
  const tempos  = pickTempos(store, n);

  const sets = keyObjs.map((k, i) => ({
    key:       k.key,
    isBlack:   k.isBlack,
    touchName: touches[i].name,
    touchDesc: touches[i].desc,
    touchTrains: touches[i].trains,
    tempo:     tempos[i],
    t:         Date.now() + i
  }));

  sets.forEach(s => {
    store.last5.push({ key: s.key, touchName: s.touchName, tempo: s.tempo });
  });
  store.last5 = store.last5.slice(-5);
  store.history.push(...sets);
  saveStore(store);

  renderResults(sets);
  renderHistory(store.history);
}

// ── Clear ──────────────────────────────────────────────────────────────────

function clearHistory() {
  saveStore(freshStore());
  document.getElementById('results').innerHTML = `
    <div class="empty-state">
      <span class="empty-icon">𝄫</span>
      <p>Tap a button to draw your practice set</p>
    </div>`;
  renderHistory([]);
}

// ── Render ─────────────────────────────────────────────────────────────────

function renderResults(sets) {
  const n = sets.length;
  document.getElementById('results').innerHTML = sets.map((s, i) => `
    <div class="result-card" style="animation-delay:${i * 0.08}s">
      ${n > 1 ? `<div class="card-set-num">Set ${i+1} of ${n}</div>` : ''}
      <div class="card-key">
        ${s.key}
        ${s.isBlack ? '<span class="black-badge">♯♭</span>' : ''}
      </div>
      <div class="card-row">
        <span class="card-field">Touch</span>
        <div>
          <div class="touch-name">${s.touchName}</div>
          <div class="touch-desc">${s.touchDesc}</div>
          <div class="touch-trains">Trains: ${s.touchTrains}</div>
        </div>
      </div>
      <div class="card-row" style="margin-top:8px">
        <span class="card-field">Tempo</span>
        <span class="card-val">${s.tempo} BPM · 4/4</span>
      </div>
      <div class="card-divider"></div>
      <div class="card-pattern">
        <span>↑ Ascending</span>
        <span class="arrow">→</span>
        <span>Contrary motion</span>
        <span class="arrow">→</span>
        <span>↓ Descending</span>
      </div>
    </div>
  `).join('');
}

function renderHistory(hist) {
  const el = document.getElementById('history');
  if (!hist || !hist.length) {
    el.innerHTML = '<div class="hist-empty">— no draws yet —</div>';
    return;
  }
  el.innerHTML = [...hist].reverse().map(x => `
    <div class="hist-item">
      <div class="hist-key">${x.key}</div>
      <div class="hist-time">${new Date(x.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
      <div class="hist-detail">${x.touchName} · ${x.tempo} BPM</div>
    </div>
  `).join('');
}

// ── Init ───────────────────────────────────────────────────────────────────
renderHistory(loadStore().history);
</script>
</body>
</html>
